title: MIIL
title-img: "/assets/images/uploads/logo.png"
author: Qian Wang
email: qianwang.sh@gmail.com
description: "Medical Imaging and Informatics Laboratory — ShanghaiTech University"
url: "https://qianwang-lab.github.io"
baseurl: ""
locale: "en-US"

remote_theme: "daattali/beautiful-jekyll"

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

navbar-links:
  Home: /
  Team: /team/
  Research: /research/
  Publication: /publication/

social-network-links:
  email: qianwang.sh@gmail.com
  github: qianwang-lab

avatar: "/assets/images/uploads/avatar.png"
round-avatar: true

collections:
  research:
    output: true
    permalink: /research/:name/
  people:
    output: true
    permalink: /:collection/:name/
  publications:
    output: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      read_time: true
  - scope:
      path: ""
      type: research
    values:
      layout: page

# Beautiful Jekyll color settings
navbar-col: "#8C1820"
navbar-text-col: "#F5F0EB"
navbar-border-col: "#A31D23"
page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#B51F24"
hover-col: "#C8A45C"
footer-col: "#8C1820"
footer-text-col: "#D4CBC0"
footer-link-col: "#C8A45C"

# Custom CSS for gradient+vibrant style
site-css:
  - "/assets/css/style.css"

include:
  - _pages
